# CONTROL 15 — every push and pull request is checked.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control-documents:
    name: CONTROL documents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check headers, index and markers
        run: bash scripts/check-controls.sh

  lessons:
    name: Lessons (CONTROL 05)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test the lesson check
        run: bash scripts/test-check-lessons.sh
      - name: Check every lesson
        run: bash scripts/check-lessons.sh

  # Phase 3: add the software build and test job here (CONTROL 15), for example:
