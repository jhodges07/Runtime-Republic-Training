# CONTROL 15 — every push and pull request is checked.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control-documents:
    name: CONTROL documents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check headers, index and markers
        run: bash scripts/check-controls.sh --strict

  essays:
    name: Essays
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check essay headers, status and citation markers
        run: bash scripts/check-essays.sh
